[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "vnpykit"
version = "0.1.0a1"
description = "Browser-native Python application framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "VNPyKit contributors" }]
keywords = ["browser", "pyodide", "python", "ui", "webassembly"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: WebAssembly",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/visionnumbers/vnpykit"
Documentation = "https://github.com/visionnumbers/vnpykit#readme"
Issues = "https://github.com/visionnumbers/vnpykit/issues"
Repository = "https://github.com/visionnumbers/vnpykit.git"

[project.optional-dependencies]
dev = [
  "build==1.6.1",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vnpykit"]

[tool.hatch.build.targets.sdist]
include = ["src/vnpykit", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
