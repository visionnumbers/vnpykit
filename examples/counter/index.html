<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionPy standalone counter</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <h1>VisionPy standalone Pyodide demo</h1>
      <p id="status" role="status">Loading two Python applications…</p>
      <div class="apps">
        <div><h2>Instance one</h2><div id="app-one"></div></div>
        <div><h2>Instance two</h2><div id="app-two"></div></div>
      </div>
      <button id="remount" type="button">Dispose and remount instance one</button>
      <div id="scratch" aria-label="Runtime test mount"></div>
      <pre id="metrics"></pre>
    </main>
  </body>
</html>
