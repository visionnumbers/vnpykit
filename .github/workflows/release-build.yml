name: Release artifact dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - run: python -m pip install "build==1.6.1"
      - run: python -m build packages/python-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: visionpy-python-dist
          path: packages/python-sdk/dist/*

