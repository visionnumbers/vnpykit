name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python scripts/scan-secrets.py

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - run: python -m pip install "build==1.6.1"
      - run: python -m build packages/python-sdk
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -e "packages/python-sdk[dev]"
      - run: python -m ruff check packages/python-sdk
      - run: python -m mypy packages/python-sdk/src packages/python-sdk/tests
      - run: python -m pytest packages/python-sdk/tests
      - run: python -m build packages/python-sdk

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.4"
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install "build==1.6.1"
      - run: python -m build packages/python-sdk
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: mkdir -p .vnpykit/packs
      - run: pnpm --filter @vnpykit/protocol pack --pack-destination .vnpykit/packs
      - run: pnpm --filter @vnpykit/renderer pack --pack-destination .vnpykit/packs
      - run: pnpm --filter @vnpykit/runtime-pyodide pack --pack-destination .vnpykit/packs
      - run: pnpm --filter @vnpykit/embed pack --pack-destination .vnpykit/packs
      - run: pnpm --filter @vnpykit/cli pack --pack-destination .vnpykit/packs
      - run: node scripts/prepare-external-consumer.mjs
      - run: pnpm exec playwright test --config playwright.external.config.ts
