name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/scan-secrets.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - run: python -m pip install "build==1.6.1"
      - run: python -m build packages/python-sdk
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip
      - run: python -m pip install --upgrade "pip==26.2.1"
      - run: python -m pip install -e "packages/python-sdk[dev]"
      - run: python -m ruff check packages/python-sdk
      - run: python -m mypy packages/python-sdk/src packages/python-sdk/tests
      - run: python -m pytest packages/python-sdk/tests
      - run: python -m build packages/python-sdk

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install "build==1.6.1"
      - run: python -m build packages/python-sdk
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
      - run: mkdir -p .visionpy/packs
      - run: pnpm --filter @visionpy/embed pack --pack-destination .visionpy/packs
      - run: pnpm --filter @visionpy/cli pack --pack-destination .visionpy/packs
      - run: node scripts/prepare-external-consumer.mjs
      - run: pnpm exec playwright test --config playwright.external.config.ts
